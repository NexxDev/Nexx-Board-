name: Build Simple Board APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Si solo subiste SimpleBoard.zip (desde el celular), lo descomprime aquí
      - name: Descomprimir proyecto
        run: |
          if [ ! -f settings.gradle.kts ] && [ -f SimpleBoard.zip ]; then
            unzip -q SimpleBoard.zip -d _src
            cp -r _src/SimpleBoard/. .
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Simple-Board-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
